<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicador de Mensajes Avanzado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app-container">
    <header class="app-header">
      <h1>Publicador de Mensajes</h1>
      <p>Gestor asíncrono con Fetch API, DOM y control de errores avanzados</p>
    </header>

    <!-- Formulario principal con novalidate para usar validaciones JS personalizadas -->
    <form id="postForm" class="post-form" novalidate>
      <div class="form-group">
        <label for="titleInput">Título de la publicación <span class="required">*</span></label>
        <input 
          type="text" 
          id="titleInput" 
          name="title" 
          placeholder="Escribe un título descriptivo..." 
          maxlength="80" 
          autocomplete="off"
        >
        <div class="input-footer">
          <small class="error-text" id="titleError"></small>
          <small class="char-counter"><span id="titleCounter">0</span>/80</small>
        </div>
      </div>

      <div class="form-group">
        <label for="bodyInput">Contenido del mensaje <span class="required">*</span></label>
        <textarea 
          id="bodyInput" 
          name="body" 
          rows="5" 
          placeholder="Escribe aquí el contenido principal..." 
          maxlength="300"
        ></textarea>
        <div class="input-footer">
          <small class="error-text" id="bodyError"></small>
          <small class="char-counter"><span id="bodyCounter">0</span>/300</small>
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="button-group">
        <button type="submit" id="submitBtn" class="btn btn-primary">
          <span class="btn-text">Publicar Mensaje</span>
          <span class="spinner" id="btnSpinner" hidden></span>
        </button>
        <button type="button" id="resetBtn" class="btn btn-secondary">Limpiar Formulario</button>
      </div>
    </form>

    <!-- Indicador visual de estado y alertas -->
    <div id="statusMessage" class="status-alert" role="alert" aria-live="polite" hidden></div>

    <!-- Sección de Historial de Mensajes Publicados -->
    <section id="historySection" class="history-section">
      <div class="history-header">
        <h2>Historial de Publicaciones (<span id="postCount">0</span>)</h2>
        <button id="clearHistoryBtn" class="btn-link" style="display: none;">Vaciar Historial</button>
      </div>
      <div id="postsFeed" class="posts-feed">
        <p class="empty-feed">No hay publicaciones enviadas en esta sesión.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
